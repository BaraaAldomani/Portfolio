# ─────────────────────────────────────────────────────────────────────────────
# CI/CD: build the Laravel app on GitHub's runners, then deploy to Hostinger
# (shared hosting) over SSH with rsync. Runs on every push to main/master.
#
# Required repo secrets (Settings → Secrets and variables → Actions → New secret).
# See deploy/CICD.md:
#   SSH_PRIVATE_KEY  the full private key (-----BEGIN ... END-----)
#   SSH_HOST         e.g. 123.45.67.89  or your server hostname
#   SSH_USER         e.g. u744145577
#   SSH_PORT         Hostinger shared hosting is usually 65002 (not 22)
#   DEPLOY_PATH      e.g. /home/u744145577/public_html
#   PHP_BIN          server CLI php is 8.2; app needs 8.3. Set to the full path
#                    /opt/alt/php83/usr/bin/php  (CloudLinux). Defaults to "php".
#
# Optional (contact-form lead alerts, written into the server .env each deploy):
#   TELEGRAM_BOT_TOKEN   from @BotFather
#   TELEGRAM_CHAT_ID     your chat id (see config/services.php)
#   LEAD_NOTIFY_EMAIL    inbox for email alerts (needs MAIL_* on the server)
#
# The site's address is NOT a secret: it is PRIMARY_URL below. To move the site
# to another domain see "Moving to another domain" in deploy/CICD.md.
# ─────────────────────────────────────────────────────────────────────────────
name: Deploy to Hostinger

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}   # lets you trigger a deploy manually from the Actions tab

# Cancel an in-progress deploy if you push again before it finishes.
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      # The one address the site answers on. Every other host this folder is
      # served under (www, an older domain) is redirected to it, and every
      # link the site writes uses it (app/Http/Middleware/PrimaryHost.php).
      # Change it only after the new address already serves this folder: the
      # deploy refuses otherwise.
      PRIMARY_URL: https://baraa.rakeez-llc.com
      # Other domains on the same hosting account that serve this same folder
      # (space separated). scripts/link-alias.sh links each one's public_html
      # to DEPLOY_PATH.
      ALIAS_DOMAINS: baraadom.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1) PHP + Composer dependencies → vendor/
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-progress

      # 2) Front-end assets → public/build/
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build assets
        run: |
          npm ci
          npm run build

      # 3) Ship to Hostinger, then run remote artisan commands
      - name: Deploy over SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          PHP_BIN: ${{ secrets.PHP_BIN || 'php' }}
          # Optional: contact-form lead alerts, copied into the server .env.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LEAD_NOTIFY_EMAIL: ${{ secrets.LEAD_NOTIFY_EMAIL }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # Strip any Windows CR characters that can mangle a pasted key.
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          # Quick auth probe so the log shows a clear reason if the key is rejected.
          ssh -p "$SSH_PORT" -i ~/.ssh/deploy_key -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            "$SSH_USER@$SSH_HOST" 'echo SSH_OK; whoami; pwd'

          # Changing PRIMARY_URL sends every visitor to the new address. Refuse
          # unless that address already answers with this site (its robots.txt
          # names the sitemap; a host's placeholder page does not), so a typo or
          # a domain that is not linked yet can never take the site down.
          current="$(ssh -p "$SSH_PORT" -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" \
            "grep -E '^PRIMARY_URL=' '$DEPLOY_PATH/.env' 2>/dev/null | head -n 1 | cut -d= -f2-" | tr -d "'\r" || true)"
          if [ -n "$current" ] && [ "$current" != "$PRIMARY_URL" ]; then
            echo "Primary address changes: $current -> $PRIMARY_URL"
            if ! curl -fsSL -m 30 -A 'Mozilla/5.0 (deploy check)' "$PRIMARY_URL/robots.txt" | grep -q '^Sitemap:'; then
              echo "::error::$PRIMARY_URL does not serve this site yet. Link the domain (ALIAS_DOMAINS), deploy, check it, then change PRIMARY_URL."
              exit 1
            fi
          fi

          # Sync the app. No --delete: server-side .env and uploaded images are safe.
          rsync -az --no-perms --no-owner --no-group \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='deploy/' \
            --exclude='tests/' \
            --exclude='.env' \
            --exclude='storage/logs/*' \
            --exclude='storage/framework/cache/data/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/views/*' \
            -e "ssh -p $SSH_PORT -i ~/.ssh/deploy_key" \
            ./ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

          # Secrets that live only in GitHub (never in git) → server .env.
          # Piped over stdin so they never show up on a command line; empty
          # secrets are skipped, so nothing set by hand on the server is wiped.
          # The site's address goes the same way: APP_URL (uploaded files, mail)
          # and PRIMARY_URL (the one host the site answers on) always match.
          printf 'TELEGRAM_BOT_TOKEN=%s\nTELEGRAM_CHAT_ID=%s\nLEAD_NOTIFY_EMAIL=%s\nAPP_URL=%s\nPRIMARY_URL=%s\n' \
            "$TELEGRAM_BOT_TOKEN" "$TELEGRAM_CHAT_ID" "$LEAD_NOTIFY_EMAIL" "$PRIMARY_URL" "$PRIMARY_URL" \
            | ssh -p "$SSH_PORT" -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" \
              "cd '$DEPLOY_PATH' && $PHP_BIN scripts/set-env.php"

          # public/robots.txt: Laravel's stock static file, left on the server by
          # the first upload (rsync never deletes). It shadows the dynamic
          # /robots.txt route (which lists the sitemap), so remove it every time.
          #
          # Rebuild on the server. The stale-cache purge MUST be plain `rm`, not
          # an artisan command: every artisan command boots the full framework
          # first, and a cached config.php left by a previous deploy (rsync has
          # no --delete and the runner never generates one) makes package
          # providers boot against outdated config and crash before the command
          # runs (symptom: CannotRegisterIconSet "heroicons set has no prefix").
          # Deleting the cached files with rm involves no PHP boot, so it always
          # works; everything after boots against fresh, correct config.
          #
          # First deploy only (run once by hand over SSH, NOT in this pipeline, so
          # later deploys never overwrite content you edit in the dashboard):
          #   $PHP_BIN artisan db:seed --force        # initial content + settings
          #   $PHP_BIN artisan app:create-admin       # uses ADMIN_EMAIL / ADMIN_PASSWORD from .env
          ssh -p "$SSH_PORT" -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" "set -e; cd '$DEPLOY_PATH'; \
            rm -f bootstrap/cache/config.php bootstrap/cache/routes-v7.php bootstrap/cache/events.php; \
            rm -f public/robots.txt; \
            $PHP_BIN artisan optimize:clear; \
            $PHP_BIN artisan migrate --force; \
            $PHP_BIN artisan filament:assets; \
            $PHP_BIN artisan storage:link || true; \
            $PHP_BIN artisan config:cache; \
            $PHP_BIN artisan route:cache; \
            $PHP_BIN artisan view:cache"

          # Other domains that serve this same folder (see ALIAS_DOMAINS above).
          ssh -p "$SSH_PORT" -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" \
            "sh '$DEPLOY_PATH/scripts/link-alias.sh' '$DEPLOY_PATH' $ALIAS_DOMAINS"

          # What each address answers now (informative: never fails the deploy).
          for host in "$PRIMARY_URL" $(printf 'https://%s ' $ALIAS_DOMAINS); do
            printf '%s/ar -> ' "$host"
            curl -s -o /dev/null -m 30 -A 'Mozilla/5.0 (deploy check)' -w '%{http_code} %{redirect_url}\n' "$host/ar" || echo 'no answer'
          done
