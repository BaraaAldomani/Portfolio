<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" fill="none" role="img" aria-label="Eyadti, medical booking system">
  <defs>
    <linearGradient id="ey-bg" x1="0" y1="0" x2="1200" y2="750" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b4a5c"/>
      <stop offset="1" stop-color="#0a141d"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#ey-bg)"/>
  <circle cx="980" cy="160" r="260" fill="#149db8" fill-opacity="0.3"/>
  <circle cx="180" cy="640" r="220" fill="#24abe3" fill-opacity="0.2"/>
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1">
    <path d="M0 250 H1200 M0 500 H1200 M300 0 V750 M600 0 V750 M900 0 V750"/>
  </g>

  <!-- medical cross motif -->
  <g transform="translate(940 470)" fill="#6fd3ea" fill-opacity="0.5">
    <rect x="-30" y="-110" width="60" height="220" rx="16"/>
    <rect x="-110" y="-30" width="220" height="60" rx="16"/>
  </g>

  <g transform="translate(150 300)">
    <rect x="0" y="0" width="150" height="150" rx="34" fill="#ffffff" fill-opacity="0.1" stroke="#6fd3ea" stroke-width="2"/>
    <text x="75" y="103" text-anchor="middle" font-family="Cairo, system-ui, sans-serif" font-size="84" font-weight="800" fill="#ffffff">E</text>
  </g>

  <g font-family="Cairo, system-ui, sans-serif" fill="#ffffff">
    <text x="150" y="540" font-size="62" font-weight="800">Eyadti</text>
    <text x="152" y="600" font-size="30" font-weight="600" fill="#a8e6f4">Healthcare</text>
  </g>
</svg>
